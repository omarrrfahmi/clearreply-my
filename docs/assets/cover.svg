<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="640" viewBox="0 0 1440 640" role="img" aria-labelledby="title desc">
<title id="title">ClearReply MY — Better replies. Less back-and-forth.</title><desc id="desc">Project identity graphic with a stylised illustrative conversation.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#102a24"/><stop offset="1" stop-color="#244a40"/></linearGradient></defs><rect width="1440" height="640" rx="28" fill="url(#bg)"/><circle cx="1360" cy="20" r="360" fill="#fff" opacity=".025"/><circle cx="1360" cy="20" r="230" fill="none" stroke="#fff" opacity=".06"/>
<path d="M66 61h31v23H78L66 95Z" fill="none" stroke="#d7e8dc" stroke-width="2" stroke-linejoin="round"/><path d="M73 69h17m-17 7h11" stroke="#d7e8dc" stroke-width="2" stroke-linecap="round"/>
<g font-family="Arial,Helvetica,sans-serif"><text x="112" y="84" fill="#f8faf7" font-size="27" font-weight="600" letter-spacing="-1">ClearReply <tspan fill="#a3c1b2" font-size="16">MY</tspan></text><text x="67" y="180" fill="#a3c1b2" font-size="13" letter-spacing="3">SERVICE WEBSITE / PORTFOLIO PROJECT</text><text x="62" y="270" fill="#f7faf6" font-size="75" font-weight="600" letter-spacing="-3">Better replies.</text><text x="62" y="357" fill="#abc5b6" font-size="65" font-weight="500" letter-spacing="-3">Less back-and-forth.</text><text x="67" y="417" fill="#c2d3c8" font-size="20">A clear offer. A quieter interface. A direct next step.</text><rect x="66" y="465" width="212" height="43" rx="22" fill="#dceadf"/><text x="172" y="492" text-anchor="middle" fill="#1c382e" font-size="13" font-weight="600">HTML · CSS · JAVASCRIPT</text><text x="68" y="584" fill="#a3c1b2" font-size="12" letter-spacing="1.5">OMAR AHMED</text><text x="1359" y="584" text-anchor="end" fill="#a3c1b2" font-size="12" letter-spacing="1.5">DESIGN → ENQUIRY</text>
<rect x="858" y="136" width="503" height="362" rx="22" fill="#f7f9f5"/><circle cx="884" cy="162" r="4" fill="#cbd3cb"/><circle cx="898" cy="162" r="4" fill="#cbd3cb"/><circle cx="912" cy="162" r="4" fill="#cbd3cb"/><text x="1334" y="167" text-anchor="end" fill="#78867b" font-size="10" letter-spacing="2">ILLUSTRATIVE CONVERSATION</text><path d="M858 185h503" stroke="#e4e9e1"/><rect x="884" y="215" width="306" height="58" rx="16" fill="#e7ece5"/><text x="904" y="251" fill="#34463a" font-size="17">Hi! How much for a house clean?</text><rect x="937" y="291" width="398" height="143" rx="16" fill="#244a40"/><text x="959" y="322" fill="#f3f6f1" font-size="16"><tspan x="959">Thanks for getting in touch. Could you</tspan><tspan x="959" dy="25">share your area, home size and the</tspan><tspan x="959" dy="25">cleaning tasks you need? We’ll confirm</tspan><tspan x="959" dy="25">a quote before you decide.</tspan></text><text x="1110" y="470" text-anchor="middle" fill="#738176" font-size="11" letter-spacing="1.2">ONE ENQUIRY. A CLEAR NEXT STEP.</text></g></svg>
