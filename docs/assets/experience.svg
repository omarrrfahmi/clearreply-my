<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="640" viewBox="0 0 1440 640" role="img" aria-labelledby="title desc"><title id="title">From interest to a conversation</title><desc id="desc">Project diagram showing the offer, consultation request and private follow-up. A schematic, not a screenshot.</desc><rect width="1440" height="640" rx="28" fill="#f2f4ef"/>
<g font-family="Arial,Helvetica,sans-serif"><text x="62" y="66" fill="#3e6a52" font-size="12" letter-spacing="2.7">THE EXPERIENCE</text><text x="59" y="125" fill="#202a23" font-size="44" font-weight="600" letter-spacing="-1.7">From interest to a conversation.</text><text x="63" y="166" fill="#677469" font-size="17">A focused visitor journey, without a public inbox address.</text>
<rect x="60" y="207" width="402" height="315" rx="17" fill="#fff" stroke="#dce3d8"/><text x="85" y="249" fill="#66836b" font-size="12" letter-spacing="2">01 / UNDERSTAND</text><text x="85" y="292" fill="#243d2b" font-size="25" font-weight="600">One kit. RM199.</text><path d="M85 314h352" stroke="#e3e8df"/><text x="85" y="351" fill="#3e6a52" font-size="27">01</text><text x="143" y="347" fill="#4d5e50" font-size="16">Service description</text><text x="85" y="400" fill="#3e6a52" font-size="27">08</text><text x="143" y="396" fill="#4d5e50" font-size="16">Customer FAQs</text><text x="85" y="449" fill="#3e6a52" font-size="27">10</text><text x="143" y="445" fill="#4d5e50" font-size="16">Reusable replies</text><text x="85" y="495" fill="#82907f" font-size="12">Scope and price, visible before applying.</text>
<rect x="519" y="207" width="402" height="315" rx="17" fill="#fff" stroke="#dce3d8"/><text x="544" y="249" fill="#66836b" font-size="12" letter-spacing="2">02 / REQUEST</text><text x="544" y="292" fill="#243d2b" font-size="25" font-weight="600">Tell us a little.</text><rect x="544" y="316" width="170" height="42" rx="8" fill="#f5f7f2" stroke="#dde4d8"/><text x="558" y="343" fill="#7a8978" font-size="13">Name</text><rect x="727" y="316" width="170" height="42" rx="8" fill="#f5f7f2" stroke="#dde4d8"/><text x="741" y="343" fill="#7a8978" font-size="13">Business</text><rect x="544" y="372" width="352" height="42" rx="8" fill="#f5f7f2" stroke="#dde4d8"/><text x="558" y="399" fill="#7a8978" font-size="13">Contact details + preferred method</text><rect x="544" y="434" width="215" height="42" rx="21" fill="#244a40"/><text x="651" y="461" fill="#fff" text-anchor="middle" font-size="12">Request a consultation ↗</text><text x="544" y="499" fill="#82907f" font-size="12">Consent, clear labels and spam protection.</text>
<rect x="978" y="207" width="402" height="315" rx="17" fill="#244a40"/><text x="1003" y="249" fill="#acc7b4" font-size="12" letter-spacing="2">03 / CONNECT</text><text x="1003" y="292" fill="#f7faf5" font-size="25" font-weight="600">Review. Then reach out.</text><rect x="1003" y="322" width="351" height="96" rx="12" fill="#365c4f"/><text x="1023" y="352" fill="#f0f5ed" font-size="16">Private form dashboard</text><text x="1023" y="383" fill="#b9ccbc" font-size="13">Enquiry details and contact preferences</text><text x="1003" y="454" fill="#d8e4d7" font-size="15">Omar follows up personally.</text><text x="1003" y="493" fill="#acc7b4" font-size="12">No automatic purchase or booking.</text><path d="M478 366h24m-8-7 8 7-8 7M937 366h24m-8-7 8 7-8 7" fill="none" stroke="#839681" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="63" y="581" fill="#7b8979" font-size="12">PROJECT SCHEMATIC · NOT A BROWSER SCREENSHOT</text><text x="1379" y="581" text-anchor="end" fill="#7b8979" font-size="12">FORM RECEIPT REQUIRES NETLIFY ACTIVATION + TESTING</text></g></svg>
